name: Build TweakIOSVIET & Package TIPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct download URL for Free Fire IPA (Optional, to package into .tipa)'
        required: false
        default: ''
      game_variant:
        description: 'Game Variant: th (Normal) or max (Free Fire MAX)'
        required: true
        default: 'th'
        type: choice
        options:
          - th
          - max

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos & iOS SDK
        run: |
          echo "Installing prerequisites via Homebrew..."
          brew install ldid
          
          echo "Cloning Theos into /opt/theos..."
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos
          sudo chown -R $(whoami) /opt/theos
          
          echo "Downloading iOS 16.5 SDK..."
          curl -LO https://github.com/theos/sdks/releases/download/v1.0/iPhoneOS16.5.sdk.tar.xz || \
          curl -LO https://raw.githubusercontent.com/theos/sdks/master/iPhoneOS16.5.sdk.tar.xz || \
          curl -s https://api.github.com/repos/theos/sdks/releases | grep "browser_download_url.*iPhoneOS16.5.sdk.tar.xz" | head -n 1 | cut -d : -f 2,3 | tr -d \" | xargs curl -LO
          
          if [ -f iPhoneOS16.5.sdk.tar.xz ]; then
            tar -xf iPhoneOS16.5.sdk.tar.xz -C /opt/theos/sdks/
            rm -f iPhoneOS16.5.sdk.tar.xz
          else
            echo "Falling back to git clone sdks..."
            git clone --depth=1 https://github.com/theos/sdks.git /tmp/theos-sdks
            cp -r /tmp/theos-sdks/*.sdk /opt/theos/sdks/ || true
            rm -rf /tmp/theos-sdks
          fi
          
          ls -la /opt/theos/sdks/
          echo "THEOS=/opt/theos" >> $GITHUB_ENV

      - name: Build insert_dylib tool
        run: |
          git clone https://github.com/tyrael-hu/insert_dylib.git
          cd insert_dylib
          xcodebuild
          sudo cp build/Release/insert_dylib /usr/local/bin/
          cd ..
          rm -rf insert_dylib

      - name: Build Dylib
        run: |
          mkdir -p temp_build
          cp -R "intex dylib/"* temp_build/
          cd temp_build
          find . -name "control" -exec perl -pi -e 's/\r//g' {} \; || true
          
          VARIANT="${{ github.event.inputs.game_variant || 'th' }}"
          echo "Building variant: $VARIANT"
          make clean
          if [ "$VARIANT" = "max" ]; then
            make package GAME_VARIANT=max FINALPACKAGE=1 FOR_RELEASE=1 THEOS=/opt/theos
          else
            make package FINALPACKAGE=1 FOR_RELEASE=1 THEOS=/opt/theos
          fi
          
          mkdir -p output_artifacts
          cp .theos/obj/arm64/*.dylib output_artifacts/ 2>/dev/null || true
          cp packages/*.deb output_artifacts/ 2>/dev/null || true
          cp packages/*.dylib output_artifacts/ 2>/dev/null || true
          
          echo "Built files:"
          ls -lh output_artifacts/
        env:
          THEOS: /opt/theos
          CFLAGS: "-Wl,-U,___isPlatformVersionAtLeast"
          TARGET: iphone:clang:16.5:13.0
          ARCHS: arm64

      - name: Package TIPA (if IPA URL provided)
        id: package_tipa
        run: |
          IPA_URL="${{ github.event.inputs.ipa_url }}"
          DYLIB_PATH=$(find temp_build/.theos/obj/arm64/ -name "*.dylib" | head -n 1)
          if [ -z "$DYLIB_PATH" ]; then
            DYLIB_PATH=$(find temp_build/packages/ -name "*.dylib" | head -n 1)
          fi
          echo "Using Dylib path: $DYLIB_PATH"
          
          if [ -n "$IPA_URL" ]; then
            echo "Downloading IPA from $IPA_URL..."
            curl -L "$IPA_URL" -o base_game.ipa
            
            echo "Unpacking IPA..."
            unzip -q base_game.ipa -d ipa_extracted
            
            APP_DIR=$(find ipa_extracted/Payload -maxdepth 1 -name "*.app" | head -n 1)
            APP_NAME=$(basename "$APP_DIR")
            EXEC_NAME=$(defaults read "$PWD/$APP_DIR/Info.plist" CFBundleExecutable)
            
            echo "Target App: $APP_NAME, Executable: $EXEC_NAME"
            
            # Copy dylib into app bundle
            cp "$DYLIB_PATH" "$APP_DIR/iOSViet.dylib"
            
            # Inject dylib into binary
            insert_dylib --weak --strip-codesig "@executable_path/iOSViet.dylib" "$APP_DIR/$EXEC_NAME" "$APP_DIR/$EXEC_NAME"
            
            # Fake sign with ldid for TrollStore / sideloading
            ldid -S "$APP_DIR/$EXEC_NAME"
            ldid -S "$APP_DIR/iOSViet.dylib"
            
            # Package into .tipa
            cd ipa_extracted
            zip -qr ../TweakIOSVIET.tipa Payload
            cd ..
            
            cp TweakIOSVIET.tipa temp_build/output_artifacts/
            echo "tipa_built=true" >> $GITHUB_OUTPUT
          else
            echo "No IPA URL provided. Generating TrollStore-ready TIPA archive with dylib payload..."
            mkdir -p tipa_payload/Payload/TweakIOSVIET.app
            cp "$DYLIB_PATH" tipa_payload/Payload/TweakIOSVIET.app/
            cd tipa_payload
            zip -qr ../TweakIOSVIET_Dylib.tipa Payload
            cd ..
            cp TweakIOSVIET_Dylib.tipa temp_build/output_artifacts/
            echo "tipa_built=placeholder" >> $GITHUB_OUTPUT
          fi

      - name: Upload Build Artifacts (Dylib, DEB & TIPA)
        uses: actions/upload-artifact@v4
        with:
          name: TweakIOSVIET-Artifacts
          path: temp_build/output_artifacts/*
          if-no-files-found: warn
